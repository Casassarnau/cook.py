<span class="flex-shrink-0" x-text="item.emoji" aria-hidden="true"></span>
<div class="flex-1 min-w-0">
  <div class="flex items-baseline gap-1 flex-wrap">
    <span class="font-semibold" :class="darkMode ? 'text-orange-400' : 'text-indigo-700'" x-text="item.value" x-show="item.value"></span>
    <template x-if="item.unitKey === 'as_needed' || item.unitKey === 'to_taste'">
      <span class="flex items-baseline gap-1 flex-wrap">
        <span x-text="item.name"></span>
        <span x-text="item.unit"></span>
      </span>
    </template>
    <template x-if="item.unitKey == null || (item.unitKey !== 'as_needed' && item.unitKey !== 'to_taste')">
      <span class="flex items-baseline gap-1 flex-wrap">
        <span class="font-semibold" :class="darkMode ? 'text-orange-400' : 'text-indigo-700'" x-text="item.unit"></span>
        <span x-text="item.connector" x-show="item.connector"></span>
        <span x-text="item.name"></span>
      </span>
    </template>
    <span x-text="item.text" x-show="item.text"></span>
  </div>
</div>
<a
  x-show="item.recipeSlug"
  :href="'#recipe=' + item.recipeSlug"
  class="flex-shrink-0 self-center -mr-1 p-1.5 rounded-md transition-colors duration-200"
  :class="darkMode ? 'text-orange-400 hover:text-orange-300' : 'text-indigo-700 hover:text-indigo-600'"
  :aria-label="t('ingredient_recipe') + (item.recipeTitle ? ': ' + item.recipeTitle : '')"
  :title="item.recipeTitle || t('ingredient_recipe')"
  @click.stop
>
  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
    <path d="M8 7h8" />
    <path d="M8 11h6" />
  </svg>
</a>
